[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anstyle = "1.0.14"
annotate-snippets = "0.12.16"
unicode-width = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
soda-ast = { path = "crates/soda-ast" }
soda-parser = { path = "crates/soda-parser" }
soda-semantics = { path = "crates/soda-semantics" }
soda-verifier = { path = "crates/soda-verifier" }
soda-sorts = { path = "crates/soda-sorts" }
soda-diagnostics = { path = "crates/soda-diagnostics" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
